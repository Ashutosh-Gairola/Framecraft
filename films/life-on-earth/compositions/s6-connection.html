<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #d5e2ff; }
    .s6-connection-cv { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
  </style>
  <div id="root" data-composition-id="s6-connection" data-start="0" data-duration="20" data-width="1920" data-height="1080">
    <canvas id="s6-connection-cv" class="clip s6-connection-cv" data-start="0" data-duration="20" data-track-index="1" width="1920" height="1080"></canvas>
    <audio id="s6-connection-fx0" class="clip" src="assets/sfx/wind-20.wav" data-start="0" data-duration="20" data-track-index="20" data-volume="0.35"></audio>
    <audio id="s6-connection-fx1" class="clip" src="assets/sfx/birds-20.wav" data-start="0" data-duration="20" data-track-index="21" data-volume="0.3"></audio>
    <audio id="s6-connection-fx2" class="clip" src="assets/sfx/score-6.wav" data-start="0" data-duration="20" data-track-index="22" data-volume="0.5"></audio>
  </div>
  <script>
    (function () {
      // The sheet's paints: the world derives every color from these.
      const PAINT = {"sky":"#1b2d6b","ink":"#101628","moon":"#d5e2ff","accent":"#e23b4a","practical":"#f0c36a","iris":"#e7a04a","skin":"#f0c2ae","hair":"#16141c","sclera":"#f6f3ee","line":"#e7eefc","ocean":"#1e5aa0","land":"#4f7d3a","cyan":"#6fd3e6"};
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      let ready;
      const built = new Promise((resolve) => (ready = resolve));
      window.__hf.buildReady["s6-connection"] = built;
      let render = null;
      let pending = 100;
      // HyperFrames sends film time; the world is one continuous path across every scene.
      window.addEventListener("hf-seek", (e) => {
        pending = e.detail.time;
        if (render) render(pending);
        else if (e.detail.waitUntil) e.detail.waitUntil(built.then(() => render && render(pending)));
      });
      // "./": a dynamic import without it is a bare package name and never loads.
      import("./assets/world.js")
        .then((world) => {
          render = world.createWorld(document.getElementById("s6-connection-cv"), PAINT).render;
          render(pending);
        })
        .catch((error) => console.error("s6-connection: the world failed to load", error))
        .finally(() => ready());
      window.__timelines = window.__timelines || {};
      window.__timelines["s6-connection"] = gsap.timeline({ paused: true });
    })();
  </script>
</template>
