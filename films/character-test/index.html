<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Character test — html-anime</title>
    <!--
      A model-sheet turntable for the character system (harness/templates/human.js): the reference
      man drawn real and anime, and Goku. 0–8 s: each turns a full circle; 8–12 s: front, a blink and
      a smile. Deterministic: everything is renderAt(t).
    -->
    <style>
      html, body { margin: 0; background: #2f3238; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #2f3238; }
      #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
    </style>
    <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["three"] = new Promise((resolve) => (window.__threeReady = resolve));
    </script>
  </head>
  <body>
    <div id="root" data-composition-id="character-test" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <canvas id="stage" class="clip" data-start="0" data-duration="12" data-track-index="1" width="1920" height="1080"></canvas>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["character-test"] = gsap.timeline({ paused: true });
    </script>
    <script type="module">
      import * as THREE from "three";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { buildHuman, poseHuman } from "./assets/human.js";
      import { MAN, GOKU } from "./assets/cast.js";

      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("stage"), antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1920, 1080, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x2f3238);
      scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.45;
      // Studio light: a warm key, a cool rim, a soft fill.
      const key = new THREE.DirectionalLight(0xfff0e2, 2.6);
      key.position.set(2.5, 4.2, 4);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      Object.assign(key.shadow.camera, { left: -3, right: 3, top: 2.6, bottom: -0.4 });
      key.shadow.bias = -0.0004;
      scene.add(key);
      const rim = new THREE.DirectionalLight(0xcfe0ff, 1.8);
      rim.position.set(-3, 3.2, -3.5);
      scene.add(rim);
      scene.add(new THREE.HemisphereLight(0xdde6f0, 0x4a443e, 0.45));
      const floor = new THREE.Mesh(new THREE.CircleGeometry(8, 96), new THREE.MeshStandardMaterial({ color: 0x4c4e53, roughness: 0.92 }));
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      const cast = [
        { h: buildHuman(THREE, { ...MAN, style: "real" }), x: -1.15 },
        { h: buildHuman(THREE, { ...MAN, style: "anime" }), x: 0 },
        { h: buildHuman(THREE, GOKU), x: 1.15 },
      ];
      for (const c of cast) scene.add(c.h.root);
      const camera = new THREE.PerspectiveCamera(28, 1920 / 1080, 0.05, 100);
      const ease = (u) => u * u * (3 - 2 * u);

      function renderAt(t) {
        // Turn a full circle in 8 s, then hold the front: blink at 9.2 s, smile from 10 s.
        const yaw = ease(Math.min(1, t / 8)) * Math.PI * 2;
        const blink = Math.max(0, 1 - Math.abs(t - 9.2) / 0.08);
        const smile = ease(Math.min(1, Math.max(0, (t - 10) / 0.8))) * 0.8;
        for (const [i, c] of cast.entries()) {
          poseHuman(c.h, {
            at: [c.x, 0, 0],
            yaw,
            // A-pose for the sheet, a breath, a slight weight shift.
            spine: [0.02 + 0.01 * Math.sin(t * 1.6 + i), 0, 0],
            armL: { sh: [0.05, 0, 0.32], el: 0.18, hand: { curl: [0.15, 0.18, 0.22, 0.26, 0.1] } },
            armR: { sh: [0.05, 0, 0.32], el: 0.18, hand: { curl: [0.15, 0.18, 0.22, 0.26, 0.1] } },
            legL: { hip: [0, 0, 0.05] },
            legR: { hip: [0, 0, 0.05] },
            face: { blink, smile, browUp: smile * 0.3 },
          });
        }
        // The camera eases closer for the faces at the end.
        const k = ease(Math.min(1, Math.max(0, (t - 8.4) / 2.2)));
        camera.position.set(0, 0.98 + 0.55 * k, 7.6 - 3.2 * k);
        camera.lookAt(0, 0.93 + 0.55 * k, 0);
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);
      window.__threeReady();
    </script>
  </body>
</html>
