<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ren — model sheet — roof</title>
    <style>
      /* The sheet's paints (Indigo moon). Only these. */
      :root {
        --sky: #1b2d6b;
        --ink: #101628;
        --moon: #d5e2ff;
        --accent: #e23b4a;
        --practical: #f0c36a;
        --iris: #e7a04a;
        --skin: #f0c2ae;
        --hair: #16141c;
        --sclera: #f6f3ee;
        --line: #e7eefc;
      }
      html,
      body {
        margin: 0;
        background: var(--ink);
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
        max-width: 1920px;
      }
      text {
        font-family: ui-sans-serif, system-ui, sans-serif;
        fill: var(--line);
      }
      .h1 { font-size: 34px; font-weight: 700; letter-spacing: 0.04em; }
      .h2 { font-size: 15px; font-weight: 600; letter-spacing: 0.14em; fill: var(--practical); }
      .lab { font-size: 14px; opacity: 0.75; }
      .note { font-size: 16px; }
      .guide { stroke: var(--line); stroke-width: 1; opacity: 0.18; stroke-dasharray: 6 6; }
      .cell { fill: var(--sky); opacity: 0.35; }
      .figline { stroke: var(--line); stroke-width: 4; stroke-linejoin: round; }
    </style>
  </head>
  <body>

        <!-- The three mouth shapes, shared with the film's #mouth-closed / #mouth-mid / #mouth-open -->
        <path id="m-closed" d="M8,132 Q32,146 58,130" fill="none" stroke="var(--hair)" stroke-width="4" stroke-linecap="round" />

      </defs>

      <!-- Header -->
      <text class="h1" x="40" y="62">REN</text>
      <text class="lab" x="140" y="62">model sheet · films/roof · ink-cel · 7 heads · original, approved</text>
      <path d="M40 84 H1880" stroke="var(--line)" stroke-width="1" opacity="0.3" />

      <!-- ===== Turnaround ===== -->

      <!-- ===== Expressions ===== -->

        <text x="1228" y="408">neutral</text><text x="1416" y="408">resolve (the line)</text><text x="1604" y="408">blink</text><text x="1792" y="408">sakuga</text>

      <!-- ===== Mouths ===== -->

        <rect class="cell" x="1390" y="470" width="240" height="120" />

      <!-- ===== Detail: grip and pivot ===== -->
      <text class="h2" x="1140" y="660">PROP · SHORT BLADE · GRIP AND PIVOT</text>
      <rect class="cell" x="1140" y="674" width="740" height="150" />
      <g transform="translate(1240 752) rotate(-4)">

      <text class="lab" x="1160" y="808">pivot: the grip center (accent ring). Length 2.6 heads. Edge faces down at rest. Held low in the right hand.</text>

      <!-- ===== Paints ===== -->
      <text class="h2" x="40" y="1002">PAINTS</text>
      <g transform="translate(130 980)">
        <rect width="28" height="28" fill="var(--hair)" stroke="var(--line)" stroke-width="1" /><text class="lab" x="36" y="19">hair #16141c</text>
        <rect x="150" width="28" height="28" fill="var(--skin)" /><text class="lab" x="186" y="19">skin #f0c2ae</text>
        <rect x="290" width="28" height="28" fill="var(--iris)" /><text class="lab" x="326" y="19">iris #e7a04a</text>
        <rect x="430" width="28" height="28" fill="var(--sclera)" /><text class="lab" x="466" y="19">sclera #f6f3ee</text>
        <rect x="590" width="28" height="28" fill="var(--ink)" stroke="var(--line)" stroke-width="1" /><text class="lab" x="626" y="19">coat: ink #101628</text>
        <rect x="770" width="28" height="28" fill="var(--accent)" /><text class="lab" x="806" y="19">cord: accent #e23b4a</text>
      </g>

      <!-- ===== Notes ===== -->
      <text class="h2" x="1140" y="872">NOTES</text>
      <g class="note">
        <text x="1140" y="904">Silhouette: long coat flaring from the hips, one lock falling past the right jaw.</text>
        <text x="1140" y="932">Line: coat contour 4px here, 6px at film scale; shadow is ink at 20%, one shape.</text>
        <text x="1140" y="960">Eyes: right eye larger in three-quarter; two catchlights, upper left.</text>
        <text x="1140" y="988">Never change: the red cord at the collar, three bang chunks, the moon sheen.</text>
        <text x="1140" y="1016">Voice: male register, resolve. The line is said with the jaw set.</text>
      </g>
    </svg>
  </body>
</html>
