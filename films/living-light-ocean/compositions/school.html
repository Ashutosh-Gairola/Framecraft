<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #101628; }
    .school-cv { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
  </style>
  <div id="root" data-composition-id="school" data-start="0" data-duration="8" data-width="1920" data-height="1080">
    <canvas id="school-cv" class="clip school-cv" data-start="0" data-duration="8" data-track-index="1" width="1920" height="1080"></canvas>
  </div>
  <script>
    (function () {
      // The sheet's paints: the world derives every colour from these.
      const PAINT = {"sky":"#1b2d6b","ink":"#101628","moon":"#d5e2ff","accent":"#e23b4a","practical":"#f0c36a","iris":"#e7a04a","skin":"#f0c2ae","hair":"#16141c","sclera":"#f6f3ee","line":"#e7eefc","plankton":"#42dff5","shell":"#526b4a","oceanlight":"#2857a4"};
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      let ready;
      const built = new Promise((resolve) => (ready = resolve));
      window.__hf.buildReady["school"] = built;
      let render = null;
      let pending = 16;
      // HyperFrames sends film time; the world is one continuous path across every scene.
      window.addEventListener("hf-seek", (e) => {
        pending = e.detail.time;
        if (render) render(pending);
        else if (e.detail.waitUntil) e.detail.waitUntil(built.then(() => render && render(pending)));
      });
      // "./": a dynamic import without it is a bare package name and never loads.
      import("./assets/world.js")
        .then((world) => {
          render = world.createWorld(document.getElementById("school-cv"), PAINT).render;
          render(pending);
        })
        .catch((error) => console.error("school: the world failed to load", error))
        .finally(() => ready());
      window.__timelines = window.__timelines || {};
      window.__timelines["school"] = gsap.timeline({ paused: true });
    })();
  </script>
</template>
