<text class="label" x="1190" y="155">SILHOUETTE RULE</text><text x="1190" y="190">Small head, broad oval shell, long front paddles,</text><text x="1190" y="218">smaller steering rear flippers. Calm and streamlined.</text><text class="label" x="1190" y="280">NEVER CHANGE</text><text x="1190" y="315">Five central scutes · four pairs of costal scutes</text><text x="1190" y="343">Pale underside · realistic, unadorned animal anatomy</text><text class="label" x="1190" y="420">SWIM CYCLE</text><text x="1190" y="455">48 frames at 24 fps · broad foreflipper power stroke</text><text x="1190" y="483">with eased recovery; rear flippers steer.</text><text class="label" x="1190" y="560">PAINTS</text><rect x="1190" y="580" width="35" height="35" fill="#526b4a"/><text x="1240" y="605">shell #526b4a</text><rect x="1430" y="580" width="35" height="35" fill="#d5e2ff"/><text x="1480" y="605">moon #d5e2ff</text><rect x="1690" y="580" width="35" height="35" fill="#101628"/><text x="1740" y="605">ink #101628</text><text x="1190" y="720">Source: NOAA Fisheries, Green Turtle Science; NOAA, Sea Turtle Biology.</text><text x="1190" y="750">Front flippers propel; hind flippers steer. No anthropomorphic features.</text></svg></html>
