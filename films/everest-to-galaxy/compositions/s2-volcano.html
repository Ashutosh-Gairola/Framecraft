<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #d5e2ff; }
    .s2-volcano-cv { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
  </style>
  <div id="root" data-composition-id="s2-volcano" data-start="0" data-duration="20" data-width="1920" data-height="1080">
    <canvas id="s2-volcano-cv" class="clip s2-volcano-cv" data-start="0" data-duration="20" data-track-index="1" width="1920" height="1080"></canvas>
    <audio id="s2-volcano-fx0" class="clip" src="assets/sfx/rumble-20.wav" data-start="0" data-duration="20" data-track-index="20" data-volume="0.75"></audio>
    <audio id="s2-volcano-fx1" class="clip" src="assets/sfx/score-2.wav" data-start="0" data-duration="20" data-track-index="21" data-volume="0.4"></audio>
    <audio id="s2-volcano-fx2" class="clip" src="assets/sfx/wind-20.wav" data-start="0" data-duration="20" data-track-index="22" data-volume="0.3"></audio>
    <audio id="s2-volcano-fx3" class="clip" src="assets/sfx/boom.wav" data-start="4" data-duration="5" data-track-index="23" data-volume="0.5"></audio>
    <audio id="s2-volcano-fx4" class="clip" src="assets/sfx/crackle.wav" data-start="7" data-duration="1.5" data-track-index="24" data-volume="0.4"></audio>
    <audio id="s2-volcano-fx5" class="clip" src="assets/sfx/thunder.wav" data-start="11" data-duration="3.6" data-track-index="23" data-volume="0.5"></audio>
    <audio id="s2-volcano-fx6" class="clip" src="assets/sfx/boom.wav" data-start="15.5" data-duration="4.5" data-track-index="23" data-volume="0.6"></audio>
  </div>
  <script>
    (function () {
      // The sheet's paints: the world derives every color from these.
      const PAINT = {"sky":"#1b2d6b","ink":"#101628","moon":"#d5e2ff","accent":"#e23b4a","practical":"#f0c36a","iris":"#e7a04a","skin":"#f0c2ae","hair":"#16141c","sclera":"#f6f3ee","line":"#e7eefc","ocean":"#1e5aa0","land":"#4f7d3a","cyan":"#6fd3e6"};
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      let ready;
      const built = new Promise((resolve) => (ready = resolve));
      window.__hf.buildReady["s2-volcano"] = built;
      let render = null;
      let pending = 20;
      // HyperFrames sends film time; the world is one continuous path across every scene.
      window.addEventListener("hf-seek", (e) => {
        pending = e.detail.time;
        if (render) render(pending);
        else if (e.detail.waitUntil) e.detail.waitUntil(built.then(() => render && render(pending)));
      });
      // "./": a dynamic import without it is a bare package name and never loads.
      import("./assets/world.js")
        .then((world) => {
          render = world.createWorld(document.getElementById("s2-volcano-cv"), PAINT).render;
          render(pending);
        })
        .catch((error) => console.error("s2-volcano: the world failed to load", error))
        .finally(() => ready());
      window.__timelines = window.__timelines || {};
      window.__timelines["s2-volcano"] = gsap.timeline({ paused: true });
    })();
  </script>
</template>
