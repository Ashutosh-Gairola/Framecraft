<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #d5e2ff; }
    .s5-solar-system-cv { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
  </style>
  <div id="root" data-composition-id="s5-solar-system" data-start="0" data-duration="20" data-width="1920" data-height="1080">
    <canvas id="s5-solar-system-cv" class="clip s5-solar-system-cv" data-start="0" data-duration="20" data-track-index="1" width="1920" height="1080"></canvas>
    <audio id="s5-solar-system-fx0" class="clip" src="assets/sfx/drone-20.wav" data-start="0" data-duration="20" data-track-index="20" data-volume="0.5"></audio>
    <audio id="s5-solar-system-fx1" class="clip" src="assets/sfx/score-5.wav" data-start="0" data-duration="20" data-track-index="21" data-volume="0.5"></audio>
    <audio id="s5-solar-system-fx2" class="clip" src="assets/sfx/bell.wav" data-start="9.5" data-duration="7" data-track-index="22" data-volume="0.2"></audio>
  </div>
  <script>
    (function () {
      // The sheet's paints: the world derives every color from these.
      const PAINT = {"sky":"#1b2d6b","ink":"#101628","moon":"#d5e2ff","accent":"#e23b4a","practical":"#f0c36a","iris":"#e7a04a","skin":"#f0c2ae","hair":"#16141c","sclera":"#f6f3ee","line":"#e7eefc","ocean":"#1e5aa0","land":"#4f7d3a","cyan":"#6fd3e6"};
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      let ready;
      const built = new Promise((resolve) => (ready = resolve));
      window.__hf.buildReady["s5-solar-system"] = built;
      let render = null;
      let pending = 80;
      // HyperFrames sends film time; the world is one continuous path across every scene.
      window.addEventListener("hf-seek", (e) => {
        pending = e.detail.time;
        if (render) render(pending);
        else if (e.detail.waitUntil) e.detail.waitUntil(built.then(() => render && render(pending)));
      });
      // "./": a dynamic import without it is a bare package name and never loads.
      import("./assets/world.js")
        .then((world) => {
          render = world.createWorld(document.getElementById("s5-solar-system-cv"), PAINT).render;
          render(pending);
        })
        .catch((error) => console.error("s5-solar-system: the world failed to load", error))
        .finally(() => ready());
      window.__timelines = window.__timelines || {};
      window.__timelines["s5-solar-system"] = gsap.timeline({ paused: true });
    })();
  </script>
</template>
