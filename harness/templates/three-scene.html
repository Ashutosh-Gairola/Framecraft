<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>3D actor template — html-anime</title>
    <!--
      A deterministic three.js scene for HyperFrames (skills/html-anime-3d-actor/SKILL.md).
      Everything visible is renderAt(t): a pure function of timeline time. No requestAnimationFrame,
      no clock, no Math.random(). HyperFrames seeks with "hf-seek"; heavy setup resolves
      window.__hf.buildReady["three"] before the first capture.
      Copy to films/<slug>/index.html (or a scene composition), then replace the actor, the set,
      and the camera path. Colors are the sheet's hexes.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #101628;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #101628;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        display: block;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      // Ready gate: HyperFrames waits for this before capturing frames.
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["three"] = new Promise((resolve) => (window.__threeReady = resolve));
    </script>
  </head>
  <body>
    <div id="root" data-composition-id="scene3d" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <canvas id="stage" class="clip" data-start="0" data-duration="6" data-track-index="1" width="1920" height="1080"></canvas>
    </div>
    <script>
      // HyperFrames needs a registered timeline; the 3D frame itself is drawn in renderAt(t).
      window.__timelines = window.__timelines || {};
      window.__timelines["scene3d"] = gsap.timeline({ paused: true });
    </script>
    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

      const W = 1920;
      const H = 1080;
      const PAINT = { sky: "#1b2d6b", ink: "#101628", moon: "#d5e2ff", accent: "#e23b4a", practical: "#f0c36a", skin: "#f0c2ae", hair: "#16141c", line: "#e7eefc" };

      // Seeded randomness: same seed, same film.
      function mulberry32(a) {
        return () => {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(7);

      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("stage"), antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(PAINT.sky);
      scene.fog = new THREE.Fog(PAINT.sky, 18, 70);
      const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 400);

      // Cel look: a 3-step toon ramp, and an ink outline from back faces pushed out (inverted hull).
      const ramp = new THREE.DataTexture(new Uint8Array([70, 70, 70, 255, 170, 170, 170, 255, 255, 255, 255, 255]), 3, 1, THREE.RGBAFormat);
      ramp.minFilter = ramp.magFilter = THREE.NearestFilter;
      ramp.needsUpdate = true;
      const toon = (hex) => new THREE.MeshToonMaterial({ color: hex, gradientMap: ramp });
      const inkMat = new THREE.MeshBasicMaterial({ color: PAINT.ink, side: THREE.BackSide });
      function inked(geometry, hex, outline = 0.04) {
        const g = new THREE.Group();
        g.add(new THREE.Mesh(geometry, toon(hex)));
        const hull = new THREE.Mesh(geometry, inkMat);
        hull.scale.setScalar(1 + outline);
        g.add(hull);
        return g;
      }

      // Light: a warm key, a cool rim, a soft fill.
      const key = new THREE.DirectionalLight(PAINT.practical, 2.2);
      key.position.set(6, 10, 6);
      const rim = new THREE.DirectionalLight(PAINT.moon, 1.4);
      rim.position.set(-8, 6, -6);
      scene.add(key, rim, new THREE.HemisphereLight(PAINT.moon, PAINT.ink, 0.6));

      // The set: ground, a tower with lit windows, and a field of seeded rocks.
      const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 48), toon(PAINT.ink));
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);
      const tower = inked(new THREE.BoxGeometry(3, 12, 3), PAINT.hair, 0.02);
      tower.position.set(-5, 6, -6);
      scene.add(tower);
      const windowMat = new THREE.MeshBasicMaterial({ color: PAINT.practical });
      for (let y = 1.5; y < 11.5; y += 1.4) {
        for (const x of [-0.8, 0, 0.8]) {
          if (rand() < 0.45) continue;
          const w = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.6), windowMat);
          w.position.set(-5 + x, y, -4.49);
          scene.add(w);
        }
      }
      for (let i = 0; i < 24; i += 1) {
        const r = inked(new THREE.DodecahedronGeometry(0.3 + rand() * 0.6), PAINT.hair, 0.05);
        const a = rand() * Math.PI * 2;
        const d = 8 + rand() * 20;
        r.position.set(Math.cos(a) * d, 0.2, Math.sin(a) * d);
        r.rotation.set(rand() * 3, rand() * 3, 0);
        scene.add(r);
      }

      // The actor: a jointed figure. Each limb is a group pivoting at its joint.
      function limb(len, radius, hex) {
        const pivot = new THREE.Group();
        const mesh = inked(new THREE.CapsuleGeometry(radius, len, 6, 12), hex);
        mesh.position.y = -len / 2;
        pivot.add(mesh);
        return pivot;
      }
      const actor = new THREE.Group();
      const hips = new THREE.Group();
      hips.position.y = 1.9;
      actor.add(hips);
      const torso = inked(new THREE.CapsuleGeometry(0.42, 0.9, 6, 16), PAINT.hair);
      torso.position.y = 0.75;
      hips.add(torso);
      const head = inked(new THREE.SphereGeometry(0.34, 24, 16), PAINT.skin);
      head.position.y = 1.62;
      hips.add(head);
      const hair = inked(new THREE.SphereGeometry(0.37, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.55), PAINT.line);
      hair.position.y = 1.7;
      hips.add(hair);
      const armL = limb(0.9, 0.12, PAINT.hair);
      const armR = limb(0.9, 0.12, PAINT.hair);
      armL.position.set(0.55, 1.25, 0);
      armR.position.set(-0.55, 1.25, 0);
      const legL = limb(1.0, 0.15, PAINT.ink);
      const legR = limb(1.0, 0.15, PAINT.ink);
      legL.position.set(0.22, 0, 0);
      legR.position.set(-0.22, 0, 0);
      hips.add(armL, armR, legL, legR);
      const blade = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.8, 0.02), new THREE.MeshBasicMaterial({ color: PAINT.accent }));
      blade.position.y = -1.6;
      armR.add(blade);
      scene.add(actor);

      // Motion as a function of t. Keys are [time, value]; smoothstep between them.
      function keyed(keys, t) {
        if (t <= keys[0][0]) return keys[0][1];
        for (let i = 0; i < keys.length - 1; i += 1) {
          const [t0, v0] = keys[i];
          const [t1, v1] = keys[i + 1];
          if (t <= t1) {
            const u = (t - t0) / (t1 - t0);
            return v0 + (v1 - v0) * u * u * (3 - 2 * u);
          }
        }
        return keys.at(-1)[1];
      }

      function renderAt(t) {
        // The actor: idle breath, then a wind-up and a horizontal cut at 3s.
        const breath = Math.sin(t * Math.PI * 1.2) * 0.03;
        hips.position.y = 1.9 + breath;
        armR.rotation.x = keyed([[0, -0.2], [2.2, -0.4], [2.7, 2.4], [3.0, -1.4], [4.2, -0.3]], t);
        armR.rotation.z = keyed([[0, -0.15], [2.7, -0.9], [3.0, 0.8], [4.2, -0.15]], t);
        armL.rotation.x = keyed([[0, 0.2], [2.7, -0.6], [3.0, 0.5], [4.2, 0.2]], t);
        legL.rotation.x = keyed([[0, 0.1], [2.6, 0.5], [3.0, -0.3], [4.2, 0.1]], t);
        legR.rotation.x = keyed([[0, -0.1], [2.6, -0.5], [3.0, 0.4], [4.2, -0.1]], t);
        hips.rotation.y = keyed([[0, 0], [2.7, 0.6], [3.0, -0.9], [4.2, 0]], t);

        // The camera: a slow orbit that tightens, never a cut.
        const a = 0.6 + t * 0.35;
        const r = keyed([[0, 11], [6, 7]], t);
        camera.position.set(Math.sin(a) * r, 2.6 + Math.sin(t * 0.5) * 0.3, Math.cos(a) * r);
        camera.lookAt(0, 2.2, 0);

        renderer.render(scene, camera);
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);
      window.__threeReady();
    </script>
  </body>
</html>
